<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>My Blog</title>
  <meta name="description" content="마크다운으로 쓰는 블로그">
  <script>
    // FOUC 방지: CSS 로드 전에 저장된 테마를 적용
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/markdown.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-title" href="index.html">My Blog</a>
      <button class="theme-toggle" type="button" aria-label="테마 전환"></button>
    </div>
  </header>

  <main class="site-main">
    <div class="container" id="app">
      <h1 class="page-heading">글 목록</h1>
      <ul class="post-list" id="post-list"></ul>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">© My Blog</div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
