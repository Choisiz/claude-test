<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>My Blog</title>
  <meta name="description" content="마크다운으로 쓰는 블로그">
  <script>
    // FOUC 방지: CSS 로드 전에 저장된 테마를 적용
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/markdown.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-title" href="index.html">My Blog</a>
      <button class="theme-toggle" type="button" aria-label="테마 전환"></button>
    </div>
  </header>

  <main class="site-main">
    <div class="container" id="app">
      <section class="apps" aria-labelledby="apps-heading">
        <h2 class="section-heading" id="apps-heading">미니 웹앱</h2>
        <article class="app-card">
          <div class="app-card__preview">
            <iframe src="apps/2048/" title="2048 게임 미리보기" loading="lazy" tabindex="-1" scrolling="no"></iframe>
          </div>
          <div class="app-card__body">
            <h3 class="app-card__title"><a class="app-card__link" href="apps/2048/">2048</a></h3>
            <p class="app-card__desc">방향키로 숫자 타일을 밀어 같은 숫자를 합치는 퍼즐 게임. 점수판과 최고 점수, 모바일 스와이프를 지원합니다.</p>
          </div>
        </article>
        <article class="app-card">
          <div class="app-card__preview">
            <iframe src="apps/galaga/" title="갤러그 게임 미리보기" loading="lazy" tabindex="-1" scrolling="no"></iframe>
          </div>
          <div class="app-card__body">
            <h3 class="app-card__title"><a class="app-card__link" href="apps/galaga/">갤러그</a></h3>
            <p class="app-card__desc">좌우로 움직이며 내려오는 적 편대를 격추하는 슈팅 게임. 목숨 5개, 스테이지 진행, 효과음과 모바일 터치 버튼을 지원합니다.</p>
          </div>
        </article>
      </section>

      <h1 class="page-heading">글 목록</h1>
      <ul class="post-list" id="post-list"></ul>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">© My Blog</div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
